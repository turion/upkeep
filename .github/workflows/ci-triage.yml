name: CI failure poll

# Polls the owner's repositories for failed CI runs, re-runs the failed jobs of
# runs whose logs show a transient cause (at most once per run), and summarises
# everything else for triage. Writes: that re-run, and issues/comments in this
# repository (one issue per root cause, labelled spoke-ci-failure).
# Required secret UPKEEP_CI_TOKEN: a fine-grained token with Actions: read and
# write (and Metadata: read) on the polled repositories.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      lookback-hours:
        description: Only consider runs created in the last N hours
        default: '7'
      dry-run:
        description: Do not re-run, only report
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  poll:
    # The secret is write-capable; never run code from a non-default ref with it.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test scripts
        run: node --test .github/scripts/*.test.js
      - name: Poll failed runs
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback-hours || '7' }}
          UPKEEP_GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run == 'true' }}
        with:
          github-token: ${{ secrets.UPKEEP_CI_TOKEN }}
          script: |
            const fs = require('node:fs');
            const dir = `${process.env.GITHUB_WORKSPACE}/.github`;
            const {
              ISSUE_LABEL, extractRootCause, findMatchingIssue, issueBody, issueTitle,
              occurrenceText, selectRepos, shouldRetry,
            } = require(`${dir}/scripts/ci-failures.js`);
            const config = JSON.parse(fs.readFileSync(`${dir}/ci-triage-repos.json`, 'utf8'));
            const dryRun = process.env.DRY_RUN === 'true';
            const since = new Date(Date.now() - Number(process.env.LOOKBACK_HOURS) * 3600 * 1000).toISOString();
            const botActors = new Set(['dependabot[bot]', 'github-actions[bot]']);

            const repos = await github.paginate(github.rest.repos.listForUser, {
              username: config.owner, type: 'owner', per_page: 100,
            });
            const byName = new Map(repos.map((repo) => [repo.full_name, repo]));
            const rows = [];
            const upkeep = getOctokit(process.env.UPKEEP_GITHUB_TOKEN);
            const openIssues = await upkeep.paginate(upkeep.rest.issues.listForRepo, {
              ...context.repo, labels: ISSUE_LABEL, state: 'open', per_page: 100,
            });

            for (const fullName of selectRepos(repos, config)) {
              const [owner, repo] = fullName.split('/');
              const defaultBranch = byName.get(fullName).default_branch;
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, status: 'failure', created: `>=${since}`, per_page: 100,
              });
              for (const run of runs) {
                // Default branch and bot-authored (e.g. dependabot) runs only; other PRs are excluded.
                if (run.head_branch !== defaultBranch && !botActors.has(run.actor?.login)) continue;
                const { data: { jobs } } = await github.rest.actions.listJobsForWorkflowRun({
                  owner, repo, run_id: run.id, filter: 'latest', per_page: 100,
                });
                const jobLogs = [];
                let cause = { kind: 'unknown', subject: null, excerpt: [] };
                for (const job of jobs.filter((j) => j.conclusion === 'failure')) {
                  const { data } = await github.request(
                    'GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', { owner, repo, job_id: job.id });
                  const log = String(data);
                  jobLogs.push(log);
                  const found = extractRootCause(log);
                  if (cause.kind === 'unknown' || found.kind === 'nix-build') cause = found;
                }
                const decision = shouldRetry({ runAttempt: run.run_attempt, jobLogs });
                const action = decision.retry ? (dryRun ? 'would retry (transient)' : 'retried (transient)') : `not retried (${decision.reason})`;
                if (decision.retry && !dryRun) {
                  await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: run.id });
                }
                if (!decision.retry && !dryRun) {
                  const occurrence = {
                    repo: fullName, run, cause, attempts: Math.min(2, run.run_attempt - 1),
                  };
                  const existing = findMatchingIssue(openIssues, cause);
                  if (!existing) {
                    const { data: created } = await upkeep.rest.issues.create({
                      ...context.repo, title: issueTitle(cause), body: issueBody(occurrence), labels: [ISSUE_LABEL],
                    });
                    openIssues.push(created);
                  } else {
                    const comments = await upkeep.paginate(upkeep.rest.issues.listComments, {
                      ...context.repo, issue_number: existing.number, per_page: 100,
                    });
                    const seen = (existing.body || '').includes(run.html_url) ||
                      comments.some((c) => (c.body || '').includes(run.html_url));
                    if (!seen) {
                      await upkeep.rest.issues.createComment({
                        ...context.repo, issue_number: existing.number,
                        body: `New occurrence:\n\n${occurrenceText(occurrence)}\n\n_Generated by upkeep (ci-triage workflow)._`,
                      });
                    }
                  }
                }
                rows.push({ repo: fullName, run, cause, action });
              }
            }

            core.summary.addHeading('CI failures since ' + since, 2);
            if (rows.length === 0) core.summary.addRaw('No failed runs.');
            for (const { repo, run, cause, action } of rows) {
              core.summary.addRaw(
                `- **${repo}** [${run.name} #${run.run_number}](${run.html_url}) attempt ${run.run_attempt}: ` +
                `${cause.kind}${cause.subject ? ' `' + cause.subject + '`' : ''} — ${action}\n`);
            }
            await core.summary.write();
