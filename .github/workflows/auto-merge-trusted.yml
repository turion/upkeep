# Auto-merge only same-repository PRs with trusted authorship, never forks.
# GitHub auto-merge waits for branch protection's required status checks.
name: Auto-merge trusted maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to evaluate
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check trusted maintenance allow-list
        id: eligibility
        uses: actions/github-script@v7
        with:
          script: |
            const pullNumber = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs['pr-number'])
              : context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });

            const sameRepository = pr.head.repo?.full_name === context.payload.repository.full_name;
            const maintainerLogin = context.repo.owner.toLowerCase();
            const authoredByMaintainer = pr.user.login.toLowerCase() === maintainerLogin;
            let coauthoredByMaintainer = false;
            let assistedByUpkeep = false;

            if (!authoredByMaintainer) {
              const query = `query($owner: String!, $name: String!, $number: Int!, $cursor: String) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    commits(first: 100, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        commit {
                          message
                          authors(first: 10) {
                            nodes { user { login } }
                          }
                        }
                      }
                    }
                  }
                }
              }`;
              let cursor = null;
              do {
                const { repository } = await github.graphql(query, {
                  owner: context.repo.owner,
                  name: context.repo.repo,
                  number: pullNumber,
                  cursor,
                });
                const page = repository.pullRequest.commits;
                for (const { commit } of page.nodes) {
                  if (commit.authors.nodes.some(({ user }) =>
                    user?.login?.toLowerCase() === maintainerLogin
                  )) {
                    coauthoredByMaintainer = true;
                  }

                  const footer = commit.message.trim().split(/\n\s*\n/).pop() || '';
                  if (/^Assisted-by:\s*upkeep-bot\s*$/m.test(footer)) {
                    assistedByUpkeep = true;
                  }
                }
                cursor = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
              } while (cursor);
            }

            const trustedAuthor = authoredByMaintainer || coauthoredByMaintainer || assistedByUpkeep;
            const safe = sameRepository && !pr.draft && trustedAuthor;

            core.setOutput('safe', String(safe));
            core.setOutput('number', String(pullNumber));
            core.info(`Trusted authorship: ${trustedAuthor}; trusted maintenance PR: ${safe}`);
      - name: Enable auto-merge
        if: steps.eligibility.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.eligibility.outputs.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch
