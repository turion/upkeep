# Auto-merge only trusted maintenance PRs from this repository, never forks.
# GitHub auto-merge waits for branch protection's required status checks.
name: Auto-merge trusted maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to evaluate
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check trusted maintenance allow-list
        id: eligibility
        uses: actions/github-script@v7
        with:
          script: |
            const pullNumber = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs['pr-number'])
              : context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });

            // Only same-repository PRs are eligible. Dependabot is trusted by
            // its immutable bot login for every update type, including major
            // versions; flake updates use these documented action/workflow
            // branch names and a restricted suffix alphabet.
            const sameRepository = pr.head.repo?.full_name === context.payload.repository.full_name;
            const dependabot = pr.user.login === 'dependabot[bot]' &&
              /^dependabot\/[a-z0-9_-]+\/[a-zA-Z0-9._/-]+$/.test(pr.head.ref);
            const flakeUpdate = [
              /^update_flake_lock_action(?:-[a-z0-9][a-z0-9._-]*)?$/,
              /^update-flake-lock(?:-[a-z0-9][a-z0-9._-]*)?$/,
              /^update-flake-lock-action(?:-[a-z0-9][a-z0-9._-]*)?$/,
            ].some((pattern) => pattern.test(pr.head.ref));
            const safe = sameRepository && !pr.draft && (dependabot || flakeUpdate);

            core.setOutput('safe', String(safe));
            core.setOutput('number', String(pullNumber));
            core.info(`Trusted maintenance PR: ${safe}`);
      - name: Enable auto-merge
        if: steps.eligibility.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.eligibility.outputs.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch
